<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fin Invest</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1720;--card:#18222e;--card2:#202d3c;--text:#e8eef5;--muted:#8a9bb0;--line:#2a3747;--accent:#4fb3ff;--up:#2ecc71;--down:#ff5c5c;--warn:#f5b041}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Sarabun',-apple-system,sans-serif;font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
header h1{font-size:20px;margin:0}
.chip{font-size:12px;padding:3px 9px;border-radius:20px;background:var(--card2);color:var(--muted)}
.chip.on{color:var(--up)}.chip.off{color:var(--warn)}
.wrap{max-width:820px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 10px}
.muted{color:var(--muted);font-size:14px}
.big{font-size:28px;font-weight:700}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:10px}
.grid div span{display:block;color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--accent);color:#06121f;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.red{background:var(--down);color:#fff}
.btn.sm{padding:6px 10px;font-size:14px}
.item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.item:first-of-type{border-top:0}
.item b{font-size:16px}
.r{text-align:right}
.badge{font-size:11px;padding:1px 7px;border-radius:8px;background:var(--card2);color:var(--muted);margin-left:6px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--card2);margin:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.prog{height:10px;border-radius:5px;background:var(--card2);overflow:hidden;margin:8px 0}
.prog div{height:100%;background:var(--up)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:16px}
textarea{min-height:70px}
.mini{width:80px;padding:6px 8px;text-align:right}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;border:0;color:var(--muted);font:inherit;font-size:12px;padding:8px 0 10px;cursor:pointer}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.act{color:var(--accent)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;overflow-y:auto;-webkit-overflow-scrolling:touch}
#modal.show{display:block}
.sheet{background:var(--card);max-width:560px;margin:40px auto 120px;border-radius:16px;padding:16px;width:calc(100% - 24px)}
.sheet h3{margin:0 0 6px}
.q{background:var(--card2);border-radius:12px;padding:10px;margin:8px 0}
.opts{display:flex;gap:6px;margin-top:8px}
.opts button{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 4px;font:inherit;font-size:14px;cursor:pointer}
.opts button.sel{background:var(--accent);color:#06121f;border-color:var(--accent)}
.res{border-radius:12px;padding:12px;margin:10px 0;border-left:5px solid}
.res.green{border-color:var(--up);background:rgba(46,204,113,.1)}
.res.yellow{border-color:var(--warn);background:rgba(245,176,65,.1)}
.res.red{border-color:var(--down);background:rgba(255,92,92,.1)}
.lesson p{margin:8px 0}
.choice{display:block;width:100%;text-align:left;margin:6px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;z-index:30;pointer-events:none}
#toast.show{opacity:.9}
canvas{width:100%;height:200px;display:block}
.empty{text-align:center;padding:20px 0;color:var(--muted)}
a.btn{text-decoration:none;display:inline-block}
.seg{display:flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;border-radius:9px;padding:9px 6px;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:#06121f}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv span{color:var(--muted)}
.kv b{text-align:right}
.chk{cursor:pointer;margin:6px 0}
.res.blue{border-color:var(--accent);background:rgba(79,179,255,.1)}
.lesson h4{margin:16px 0 4px;font-size:16px}
.lesson ul{margin:6px 0;padding-left:20px}
.lesson li{margin:3px 0}
.f{background:var(--card2);border-radius:8px;padding:8px 10px;margin:8px 0;font-weight:600}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
.tb td{padding:4px 6px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header><h1>📈 Fin Invest</h1><span id="mode" class="chip"></span></header>
<div class="wrap" id="app"><div class="empty">กำลังโหลด...</div></div>
<nav id="nav">
<button data-p="port" onclick="go('port')"><i>📊</i>พอร์ต</button>
<button data-p="doc" onclick="go('doc')"><i>🩺</i>หมอพอร์ต</button>
<button data-p="watch" onclick="go('watch')"><i>🔍</i>น่าศึกษา</button>
<button data-p="plan" onclick="go('plan')"><i>🎯</i>แผน DCA</button>
<button data-p="tx" onclick="go('tx')"><i>📝</i>บันทึก</button>
<button data-p="learn" onclick="go('learn')"><i>📚</i>เรียนรู้</button>
</nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ===== CONFIG ===== */
var SB_URL = 'https://tedzucgqmitfmddxqvge.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlZHp1Y2dxbWl0Zm1kZHhxdmdlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNDAwNjUsImV4cCI6MjA5NTYxNjA2NX0.SzeGl8aUC6Oy5Q001H6XFUbw63bgQQWHKS-KnVl4Or4';   /* anon key เดียวกับ Fin */
var ONLINE = SB_KEY.indexOf('ใส่') !== 0;

/* ===== UTIL ===== */
function $(id){return document.getElementById(id);}
function num(x){x=parseFloat(x);return isNaN(x)?0:x;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function fmt(n,d){d=d==null?2:d;return num(n).toLocaleString('th-TH',{minimumFractionDigits:d,maximumFractionDigits:d});}
function sign(n,d){return (n>0?'+':'')+fmt(n,d);}
function cls(n){return n>0?'up':(n<0?'down':'');}
function pad(n){return n<10?'0'+n:''+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function extend(a,b){for(var k in b){if(b.hasOwnProperty(k))a[k]=b[k];}return a;}
function uid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function toast(t){var e=$('toast');e.textContent=t;e.className='show';setTimeout(function(){e.className='';},1800);}
function fail(e){console.error(e);toast('ผิดพลาด: '+(e&&e.message?e.message.slice(0,80):e));}

/* ===== DB (Supabase REST หรือ localStorage) ===== */
function lsGet(t){try{return JSON.parse(localStorage.getItem('inv_'+t)||'[]');}catch(e){return [];}}
function lsSet(t,a){try{localStorage.setItem('inv_'+t,JSON.stringify(a));}catch(e){}}
function api(method,path,body,prefer){
  var h={'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'};
  if(prefer)h['Prefer']=prefer;
  return fetch(SB_URL+'/rest/v1/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined}).then(function(r){
    if(!r.ok)return r.text().then(function(t){throw new Error(t);});
    if(r.status===204)return null;
    return r.text().then(function(t){return t?JSON.parse(t):null;});
  });
}
var db={
  list:function(t){
    if(!ONLINE)return Promise.resolve(lsGet(t));
    return api('GET',t+'?select=*');
  },
  insert:function(t,row){
    if(!ONLINE){row.id=uid();var a=lsGet(t);a.push(row);lsSet(t,a);return Promise.resolve(row);}
    return api('POST',t,row,'return=minimal');
  },
  update:function(t,id,patch){
    if(!ONLINE){var a=lsGet(t);for(var i=0;i<a.length;i++){if(a[i].id===id)extend(a[i],patch);}lsSet(t,a);return Promise.resolve();}
    return api('PATCH',t+'?id=eq.'+encodeURIComponent(id),patch,'return=minimal');
  },
  remove:function(t,id){
    if(!ONLINE){lsSet(t,lsGet(t).filter(function(r){return r.id!==id;}));return Promise.resolve();}
    return api('DELETE',t+'?id=eq.'+encodeURIComponent(id),null,'return=minimal');
  },
  setting:function(key,value){
    if(!ONLINE){var a=lsGet('inv_settings').filter(function(r){return r.key!==key;});a.push({key:key,value:value});lsSet('inv_settings',a);return Promise.resolve();}
    return api('POST','inv_settings',{key:key,value:value},'resolution=merge-duplicates,return=minimal');
  }
};

/* ===== STATE ===== */
var S={h:[],tx:[],plan:{budget:500,rate:6,years:10},lessons:{},watch:[],rules:{},page:'port'};
var COLORS=['#4fb3ff','#2ecc71','#f5b041','#ff5c5c','#a569bd','#48c9b0','#ec7063','#5dade2','#f4d03f','#95a5a6'];

function load(){
  return Promise.all([db.list('inv_holdings'),db.list('inv_transactions'),db.list('inv_settings')]).then(function(r){
    S.h=r[0]||[];S.tx=r[1]||[];
    (r[2]||[]).forEach(function(s){
      if(s.key==='plan')S.plan=extend({budget:500,rate:6,years:10},s.value||{});
      if(s.key==='lessons')S.lessons=s.value||{};
      if(s.key==='watch')S.watch=s.value||[];
      if(s.key==='fee'&&s.value){FEE=num(s.value.pct);FEE_MIN=num(s.value.min);if(s.value.funds)extend(FFEE,s.value.funds);}
      if(s.key==='rules')S.rules=s.value||{};
    });
    S.h.sort(function(a,b){return a.symbol<b.symbol?-1:1;});
    S.tx.sort(function(a,b){return a.date<b.date?1:(a.date>b.date?-1:(String(a.created_at||'')<String(b.created_at||'')?1:-1));});
    updatePeaks();
    render();
  }).catch(fail);
}
function findH(id){for(var i=0;i<S.h.length;i++)if(S.h[i].id===id)return S.h[i];return null;}
function findSym(s){for(var i=0;i<S.h.length;i++)if(S.h[i].symbol===s)return S.h[i];return null;}

/* ===== CALC ===== */
function stat(h){
  var d=0,r=0;
  S.tx.forEach(function(t){if(t.symbol!==h.symbol)return;if(t.kind==='dividend')d+=num(t.amount);if(t.kind==='sell')r+=num(t.realized);});
  var cost=num(h.units)*num(h.avg_cost),val=num(h.units)*num(h.price);
  return {cost:cost,val:val,pl:val-cost,pct:cost?(val-cost)/cost*100:0,div:d,real:r,total:val-cost+d+r};
}
function totals(){
  var t={cost:0,val:0,div:0,real:0};
  S.h.forEach(function(h){var s=stat(h);t.cost+=s.cost;t.val+=s.val;t.div+=s.div;t.real+=s.real;});
  t.pl=t.val-t.cost;t.total=t.pl+t.div+t.real;t.pct=t.cost?t.pl/t.cost*100:0;t.tpct=t.cost?t.total/t.cost*100:0;
  return t;
}
function sectors(){
  var m={},tot=0,a=[],k;
  S.h.forEach(function(h){var v=stat(h).val;k=h.sector||'ไม่ระบุ';m[k]=(m[k]||0)+v;tot+=v;});
  for(k in m)a.push({k:k,v:m[k],p:tot?m[k]/tot*100:0});
  a.sort(function(x,y){return y.v-x.v;});
  return a;
}
function monthBuys(sym){
  var mo=today().slice(0,7),s=0;
  S.tx.forEach(function(t){if(t.kind==='buy'&&String(t.date).slice(0,7)===mo&&(!sym||t.symbol===sym))s+=num(t.amount)+num(t.fee);});
  return s;
}

/* ===== NAV / RENDER ===== */
function go(p){S.page=p;render();window.scrollTo(0,0);}
function render(){
  var b=$('nav').getElementsByTagName('button');
  for(var i=0;i<b.length;i++)b[i].className=b[i].getAttribute('data-p')===S.page?'act':'';
  $('mode').className='chip '+(ONLINE?'on':'off');
  $('mode').textContent=ONLINE?'● Supabase':'● โหมดทดลอง (เก็บในเครื่อง)';
  $('app').innerHTML=PAGES[S.page]();
  if(S.page==='plan')drawProj();
}
function modal(html){var m=$('modal');m.innerHTML='<div class="sheet">'+html+'</div>';m.className='show';}
function closeM(){$('modal').className='';$('modal').innerHTML='';}
$('modal').onclick=function(e){if(e.target===$('modal'))closeM();};
function fld(lab,id,val,numeric,ph){return '<label>'+lab+'</label><input id="'+id+'" value="'+esc(val==null?'':val)+'"'+(numeric?' inputmode="decimal"':'')+(ph?' placeholder="'+esc(ph)+'"':'')+'>';}

var PAGES={};

/* ===== 1. PORT ===== */
PAGES.port=function(){
  if(!S.h.length){
    return '<div class="card"><h2>เริ่มต้นพอร์ต</h2><p class="muted">ยังไม่มีรายการ กดปุ่มด้านล่างเพื่อใส่รายชื่อหุ้น/กองทุนที่ถืออยู่ แล้วค่อยกรอกจำนวน ต้นทุน และราคาทีละตัว</p>'+
    '<div class="row"><button class="btn" onclick="seed()">ใส่พอร์ตจริง (หุ้น 6 ตัว + กองกสิกร 3 กอง)</button><button class="btn ghost" onclick="editH()">+ เพิ่มเอง</button></div></div>';
  }
  var pf=S.pf||'all',hs=pfList(pf),t=pfTotals(hs),bar='',leg='',uLoss=0,uGain=0;
  hs.forEach(function(h){var pl=stat(h).pl;if(pl<0)uLoss+=pl;else uGain+=pl;});
  primeColors();
  var sm={},sa=[],sk;
  hs.forEach(function(h){var v=holdVal(h);if(v<=0)return;sk=h.sector||'ไม่ระบุ';sm[sk]=(sm[sk]||0)+v;});
  for(sk in sm)sa.push({k:sk,p:t.val?sm[sk]/t.val*100:0});
  sa.sort(function(x,y){return y.p-x.p;});
  sa.forEach(function(s){var c=secColor(s.k);bar+='<div style="width:'+s.p+'%;background:'+c+'"></div>';leg+='<span><i class="dot" style="background:'+c+'"></i>'+esc(s.k)+' '+fmt(s.p,0)+'%</span>';});
  var seg='<div class="seg">'+[['all','ทั้งหมด'],['stock','📈 หุ้น'],['fund','🏦 กองทุน']].map(function(x){return '<button class="'+(pf===x[0]?'on':'')+'" onclick="setPf(\''+x[0]+'\')">'+x[1]+'</button>';}).join('')+'</div>';
  var split='';
  if(pf==='all'){
    var ts=pfTotals(pfList('stock')),tf=pfTotals(pfList('fund'));
    split='<div class="grid" style="grid-template-columns:1fr 1fr;margin:0 0 12px">'+
     [['stock','📈 หุ้น',ts],['fund','🏦 กองทุน',tf]].map(function(x){var y=x[2];return '<div class="card" style="margin:0;cursor:pointer" onclick="setPf(\''+x[0]+'\')"><div class="muted">'+x[1]+' · '+fmt(t.val?y.val/t.val*100:0,0)+'%</div><b style="font-size:19px">'+fmt(y.val,0)+' ฿</b><div class="'+cls(y.pl)+'" style="font-size:14px">'+sign(y.pl,0)+' ('+sign(y.pct,1)+'%)</div></div>';}).join('')+'</div>';
  }
  var title=pf==='stock'?'มูลค่าพอร์ตหุ้น':(pf==='fund'?'มูลค่าพอร์ตกองทุน':'มูลค่าพอร์ตรวม');
  var list='';
  hs.forEach(function(h){
    var s=stat(h);
    list+='<div class="item" onclick="editH(\''+h.id+'\')"><div><b>'+esc(h.symbol)+'</b><span class="badge">'+(h.type==='fund'?'กองทุน':'หุ้น')+'</span><div class="muted">'+fmt(h.units,h.type==='fund'?4:0)+' @ '+fmt(h.avg_cost,h.type==='fund'?4:2)+' → '+fmt(h.price,h.type==='fund'?4:2)+'</div></div>'+
    '<div class="r"><b>'+fmt(s.val)+'</b><div class="'+cls(s.pl)+'">'+sign(s.pl)+' ('+sign(s.pct)+'%)</div>'+(s.div?'<div class="muted">ปันผล '+fmt(s.div)+'</div>':'')+'</div></div>';
  });
  return seg+split+'<div class="card"><div class="muted">'+title+'</div><div class="big">'+fmt(t.val)+' ฿</div>'+
   '<div class="grid"><div><span>ต้นทุน</span>'+fmt(t.cost)+'</div><div><span>กำไร/ขาดทุนจากราคา</span><b class="'+cls(t.pl)+'">'+sign(t.pl)+' ('+sign(t.pct)+'%)</b></div>'+
   '<div><span>ปันผลที่ได้รับแล้ว</span><b class="up">'+fmt(t.div)+'</b></div><div><span>กำไร/ขาดทุนที่ขายแล้ว</span><b class="'+cls(t.real)+'">'+sign(t.real)+'</b></div></div>'+
   '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><span class="muted">ผลรวมจริง (ราคา + ปันผล + ที่ขายแล้ว)</span><div class="big '+cls(t.total)+'" style="font-size:22px">'+sign(t.total)+' ฿ ('+sign(t.tpct)+'%)</div></div>'+
   (uLoss<0||uGain>0?'<div class="res yellow" style="margin:10px 0 0">💡 '+(uLoss<0?'ขาดทุนที่ยังไม่ขาย <b class="down">'+fmt(uLoss)+' ฿</b> คือมูลค่าที่หายไปแล้วจริง ไม่ขายก็ไม่ได้คืน — คำถามที่ถูกคือเงินที่เหลือควรอยู่ตรงไหน':'')+(uLoss<0&&uGain>0?'<br>':'')+(uGain>0?'กำไรที่ยังไม่ขาย <b class="up">+'+fmt(uGain)+' ฿</b> ยังไม่ใช่เงินในมือ ลดลงได้ถ้าราคาลง — ตั้งแผนขายไว้ที่หมอพอร์ต':'')+'</div>':'')+'</div>'+
   signalsHTML()+
   '<div class="card"><h2>สัดส่วนตามกลุ่ม'+(pf==='all'?'':(pf==='stock'?' (เฉพาะหุ้น)':' (เฉพาะกองทุน)'))+'</h2><div class="bar">'+bar+'</div><div class="legend">'+leg+'</div></div>'+
   '<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h2 style="margin:0">รายการที่ถือ</h2><div class="row"><button class="btn sm ghost" onclick="priceModal()">อัปเดตราคา</button><button class="btn sm" onclick="editH()">+ เพิ่ม</button></div></div>'+(list||'<div class="empty">ยังไม่มีรายการในกลุ่มนี้</div>')+'</div>';
};
/* แยกพอร์ต หุ้น / กองทุน */
try{S.pf=localStorage.getItem('inv_pf')||'all';}catch(e){S.pf='all';}
function setPf(v){S.pf=v;try{localStorage.setItem('inv_pf',v);}catch(e){}render();window.scrollTo(0,0);}
function pfList(pf){return S.h.filter(function(h){return pf==='all'||(pf==='fund'?h.type==='fund':h.type!=='fund');});}
function pfTotals(hs){
  var t={cost:0,val:0,div:0,real:0};
  hs.forEach(function(h){var s=stat(h);t.cost+=s.cost;t.val+=s.val;t.div+=s.div;t.real+=s.real;});
  t.pl=t.val-t.cost;t.total=t.pl+t.div+t.real;t.pct=t.cost?t.pl/t.cost*100:0;t.tpct=t.cost?t.total/t.cost*100:0;
  return t;
}

function diag(a){
  var s=0;for(var i=0;i<QS.length;i++){if(a[i]==null)return null;s+=a[i];}
  if(a[1]===0&&a[2]===0)return {lv:'red',t:'ทบทวน — เหตุผลเดิมไม่จริงแล้ว และวันนี้ก็จะไม่ซื้อ',d:'ลองเทียบว่าถ้าย้ายเงินก้อนนี้ไปตามแผน DCA จะดีกว่าไหม ไม่ต้องขายทีเดียว ทยอยลดได้',s:s};
  if(s>=8)return {lv:'green',t:'ถือต่อ — เพิ่มได้ถ้าอยู่ในแผน',d:'เหตุผลยังแข็งแรง ระวังแค่อย่าให้สัดส่วนตัวเดียวสูงเกินไป',s:s};
  if(s>=5)return {lv:'yellow',t:'ถือต่อ แต่ยังไม่ถัวเพิ่ม',d:'หาข้อมูลในข้อที่ตอบ "ไม่แน่ใจ" หรือ "ไม่" ก่อนใส่เงินเพิ่ม',s:s};
  return {lv:'red',t:'ทบทวน — พิจารณาลดสัดส่วน',d:'คะแนนต่ำ แปลว่ากำลังถือเพราะความหวังมากกว่าเหตุผล',s:s};

/* ค่าคอมหุ้น (รวม VAT และค่าธรรมเนียมตลาด) — ตั้งเองได้ที่ ⚙️ ค่าคอม ในหน้าหมอพอร์ต; กองทุนไม่คิดค่าคอม */
var FEE=0.17,FEE_MIN=0;
/* ค่าธรรมเนียมขายคืนกองทุน (% ของมูลค่าขาย) — ค่าเริ่มต้นจาก Factsheet บลจ.กสิกรไทย แก้ได้ที่ ⚙️ */
var FFEE={'K-US500X-A(A)':0.15,'K-SET50':0.10,'K-SF-A':0};
function feeOf(amt){return amt>0?Math.max(FEE_MIN,amt*FEE/100):0;}
function fundFee(sym){return num(FFEE[sym]);}
/* ค่าธรรมเนียมตอนขาย: หุ้น = ค่าคอม, กองทุน = ค่าธรรมเนียมขายคืนของกองนั้น */
function feeFor(h,amt){return amt>0?(h.type==='fund'?amt*fundFee(h.symbol)/100:feeOf(amt)):0;}
function feeTxt(){return FEE+'%'+(FEE_MIN?' ขั้นต่ำ '+fmt(FEE_MIN,0)+' ฿/คำสั่ง':'');}
function feeModal(){
  var ff='';
  S.h.forEach(function(h){if(h.type==='fund')ff+='<div class="row" style="justify-content:space-between;margin:6px 0"><span>'+esc(h.symbol)+'</span><span><input class="mini" id="ff_'+h.id+'" inputmode="decimal" value="'+fundFee(h.symbol)+'"> %</span></div>';});
  modal('<h3>⚙️ ค่าคอมและค่าธรรมเนียม</h3><p class="muted">ใช้ในเครื่องมือ "ลองคิดก่อน" และช่วยประมาณค่าธรรมเนียมในฟอร์มบันทึก</p>'+
   '<label style="font-size:15px;color:var(--text)"><b>📈 หุ้น — ค่าคอมมิชชัน</b></label>'+
   fld('ค่าคอม + VAT + ค่าธรรมเนียมตลาด (% ของมูลค่าซื้อขาย)','fe_p',FEE,true)+fld('ค่าคอมขั้นต่ำต่อคำสั่ง (฿) — ไม่มีใส่ 0','fe_m',FEE_MIN,true)+
   (ff?'<label style="font-size:15px;color:var(--text);margin-top:16px"><b>🏦 กองทุน — ค่าธรรมเนียมขายคืน (% ของมูลค่าที่ขาย)</b></label>'+ff+'<p class="muted">ค่าเริ่มต้นจาก Factsheet ของ บลจ.กสิกรไทย อาจเปลี่ยนได้ — เช็กในหนังสือชี้ชวนล่าสุดใน K PLUS · ซื้อกองทุนไม่มีค่าธรรมเนียม (ยกเว้น)</p>':'')+

function saveFee(){
  FEE=num($('fe_p').value);FEE_MIN=num($('fe_m').value);
  S.h.forEach(function(h){var e=$('ff_'+h.id);if(e)FFEE[h.symbol]=num(e.value);});
  db.setting('fee',{pct:FEE,min:FEE_MIN,funds:FFEE}).then(function(){closeM();toast('บันทึกค่าธรรมเนียมแล้ว');render();}).catch(fail);
}
var SECK=[];
var EXTRA_COLORS=['#e59866','#7fb3d5','#c39bd3','#76d7c4','#f7dc6f','#d98880'];
function secColor(k){if(/เงินสด|เงินสำรอง/.test(k))return '#dfe6ee';var i=SECK.indexOf(k);if(i<0){SECK.push(k);i=SECK.length-1;}return i<COLORS.length?COLORS[i]:EXTRA_COLORS[(i-COLORS.length)%EXTRA_COLORS.length];}
function primeColors(){SECK=sectors().map(function(s){return s.k;});}
function holdVal(h){return num(h.units)*num(h.price);}
function kv(l,v,c){return '<div class="kv"><span>'+l+'</span><b class="'+(c||'')+'">'+v+'</b></div>';}
function allocHTML(items){
  var m={},tot=0,a=[],k,bar='',leg='';
  items.forEach(function(x){if(x.v<=0)return;m[x.k]=(m[x.k]||0)+x.v;tot+=x.v;});
  for(k in m)a.push({k:k,p:m[k]/tot*100});
  a.sort(function(x,y){return y.p-x.p;});
  a.forEach(function(s){var c=secColor(s.k);bar+='<div style="width:'+s.p+'%;background:'+c+'"></div>';leg+='<span><i class="dot" style="background:'+c+'"></i>'+esc(s.k)+' '+fmt(s.p,0)+'%</span>';});
  return '<div class="bar">'+bar+'</div><div class="legend">'+leg+'</div>';
}
function maxW(a){var t=0,b={s:'-',v:0};a.forEach(function(x){if(x.v>0)t+=x.v;if(x.v>b.v)b=x;});return {s:b.s,p:t?b.v/t*100:0};}

function simAvgCalc(){

  var be0=hu&&ha>p?(ha/p-1)*100:0,be1=na>p?(na/p-1)*100:0;

   kv('ราคาต้องขึ้นกี่ % ถึงเท่าทุน',(hu?(be0?sign(be0,0)+'%':'กำไรอยู่แล้ว'):'-')+' → '+(be1?sign(be1,0)+'%':'กำไรอยู่แล้ว'))+
   kv('เงินทั้งหมดในตัวนี้',fmt(hu*ha)+' → '+fmt(hu*ha+spend)+' ฿')+
   kv('น้ำหนักในพอร์ต',fmt(w0,0)+'% → <span class="'+(w1>25?'warn':'')+'">'+fmt(w1,0)+'%</span>')+'</div>';
  if(hu){
    var sc=[[p*0.8,'ลงอีก 20%'],[p*0.9,'ลงอีก 10%'],[p,'ราคาที่ซื้อ'],[p*1.2,'ขึ้น 20%'],[p*1.5,'ขึ้น 50%']];
    if(na>p*1.001)sc.push([na,'ถึงต้นทุนใหม่']);
    if(ha>p*1.001&&Math.abs(ha-na)>0.001)sc.push([ha,'ถึงต้นทุนเดิม']);
    sc.sort(function(x,y){return x[0]-y[0];});
    var tb='<table class="tb"><tr><td class="muted">ถ้าราคาเป็น</td><td class="muted r">ไม่ถัว</td><td class="muted r">ถัว</td></tr>';
    sc.forEach(function(s){var a0=hu*(s[0]-ha),a1=nu*s[0]-(hu*ha+spend);
      tb+='<tr><td>'+fmt(s[0],d)+' <small class="muted">'+s[1]+'</small></td><td class="r '+cls(a0)+'">'+sign(a0,0)+'</td><td class="r '+cls(a1)+'"><b>'+sign(a1,0)+'</b></td></tr>';});
    html+='<label>กำไร/ขาดทุนรวม (บาท) ถ้าราคาเปลี่ยน</label>'+tb+'</table><p class="muted">ตอนซื้อ ยอดขาดทุนเป็นบาทยังเท่าเดิม แต่หลังจากนั้นทุกการขยับจะแรงขึ้นทั้งขาขึ้นและขาลง เพราะถือมากขึ้น</p>';
  }
  if(stock&&add<100)html+='<p class="muted">ต่ำกว่า 100 หุ้น ต้องซื้อในกระดานเศษหุ้น (Odd lot) ราคาอาจต่างจากกระดานหลักเล็กน้อย</p>';
  var r=h.doctor&&h.doctor.result;
  if(r&&r.lv==='red')html+='<div class="res red">หมอพอร์ตเคยให้ผล "ทบทวน" กับตัวนี้ ถัวเพิ่ม = ใส่เงินเพิ่มกับสิ่งที่คุณเองยังไม่มั่นใจ</div>';
  else if(!r&&stock&&ha>p)html+='<div class="res yellow">ยังไม่ได้ตรวจหมอพอร์ตตัวนี้ ก่อนถัวควรตอบให้ได้ว่า "ทำไมราคาจะกลับมา"</div>';
  if(w1>25&&!SAFE.test(h.sector||''))html+='<div class="res yellow">หลังซื้อ ตัวนี้จะหนักเกิน 25% ของพอร์ต</div>';

}

function simSellPreset(m){S.h.forEach(function(h){var e=$('ss_'+h.id);if(!e)return;e.value=(m==='red'&&h.type!=='fund'&&stat(h).pl<0)?100:'';});simSellCalc();}
function simSellCalc(){
  var cash=0,real=0,n=0,fee=0,before=[],after=[],o=$('ss_out');
  S.h.forEach(function(h){
    var v=holdVal(h),k=h.sector||'ไม่ระบุ',e=$('ss_'+h.id),pct=e?Math.min(100,Math.max(0,num(e.value)))/100:0;
    var su=num(h.units)*pct;if(h.type!=='fund')su=Math.round(su);
    var sv=su*num(h.price);
    if(su>0){cash+=sv;real+=(num(h.price)-num(h.avg_cost))*su;n++;fee+=feeFor(h,sv);}
    before.push({s:h.symbol,k:k,v:v});after.push({s:h.symbol,k:k,v:v-sv,id:h.id});
  });
  if(!n){o.innerHTML='<p class="muted">ยังไม่ได้เลือกตัวที่จะขาย</p>';return;}
  var net=cash-fee,to=$('ss_to').value,tn='เงินสด';
  real-=fee;
  if(to)after.forEach(function(x){if(x.id===to){x.v+=net;tn=x.s;}});
  else after.push({s:'เงินสด',k:'เงินสด',v:net});
  var m0=maxW(before),m1=maxW(after);
  o.innerHTML='<div class="q">'+kv('ได้เงินจากการขาย',fmt(cash)+' ฿')+kv('ค่าคอม + ค่าธรรมเนียมขายคืน (ประมาณ)','−'+fmt(fee)+' ฿')+
    kv('เงินสุทธิย้ายไป '+esc(tn),fmt(net)+' ฿','up')+kv('กำไร/ขาดทุนที่เกิดขึ้นจริง',sign(real)+' ฿',cls(real))+
    kv('เทียบเท่า DCA',fmt(net/(S.plan.budget||500),1)+' เดือน')+
    kv('ตัวที่หนักสุดในพอร์ต',esc(m0.s)+' '+fmt(m0.p,0)+'% → '+esc(m1.s)+' '+fmt(m1.p,0)+'%')+'</div>'+
    '<label>สัดส่วนตามกลุ่ม — ตอนนี้</label>'+allocHTML(before)+'<label>หลังขายและย้าย</label>'+allocHTML(after)+
    (real<0?'<p class="muted">ขาดทุนนี้เกิดขึ้นไปแล้วตั้งแต่ราคาลง การขายแค่ทำให้เป็นตัวเลขจริง · กำไร/ขาดทุนจากการขายหุ้นไทยในตลาดไม่มีผลทางภาษีสำหรับบุคคลธรรมดา</p>':'');
}

function simTrimCalc(){

  }

  var before=[],after=[],dest='',extra='',to=$('st_to').value;

  }else if(to.indexOf('w:')===0){

       kv('เงินเหลือ (หลังค่าคอมฝั่งซื้อ)',fmt(cash)+' ฿')+kv('น้ำหนัก '+esc(ws.s)+' ในพอร์ต',fmt(V?nv/V*100:0,1)+'%');

    }

  }else{

var RULE_DEF={maxw:30,gain:50,gsell:33,trail:15};
function saveRules(){return db.setting('rules',S.rules).catch(fail);}
function updatePeaks(){

function signals(){
  var out=[],V=totals().val,td=today();
  S.h.forEach(function(h){
    var r=S.rules[h.symbol];if(!r||!num(h.units)||!num(h.price))return;
    var p=num(h.price),v=holdVal(h),w=V?v/V*100:0,s=stat(h);
    if(r.maxw&&w>r.maxw&&!(r.snooze&&r.snooze>td)){
      var su=Math.min(num(h.units),Math.ceil((v-r.maxw/100*V)/p));
      out.push({id:h.id,k:'maxw',lv:'yellow',n:su,t:h.symbol+' หนัก '+fmt(w,1)+'% เกินเพดาน '+r.maxw+'%',d:'ตามแผน: ขายประมาณ '+fmt(su,0)+' หุ้น เพื่อกลับมาที่ '+r.maxw+'%'});

function proj(b,rate,yrs){
  var r=rate/100/12,v=0,p=0,out=[{y:0,v:0,p:0}];
  for(var m=1;m<=yrs*12;m++){v=v*(1+r)+b;p+=b;if(m%12===0)out.push({y:m/12,v:v,p:p});}
  return out;
}

function drawProj(){
  var c=$('cv');if(!c)return;
  var P=S.plan,pj=proj(P.budget,P.rate,P.years),dpr=window.devicePixelRatio||1,W=c.clientWidth,H=200;
  c.width=W*dpr;c.height=H*dpr;var g=c.getContext('2d');g.scale(dpr,dpr);
  var max=pj[pj.length-1].v||1,pad=30;
  function X(i){return pad+(W-pad-8)*i/(pj.length-1);}
  function Y(v){return H-20-(H-30)*v/max;}
  g.strokeStyle='#2a3747';g.lineWidth=1;g.fillStyle='#8a9bb0';g.font='11px Sarabun,sans-serif';
  for(var k=0;k<=4;k++){var y=Y(max*k/4);g.beginPath();g.moveTo(pad,y);g.lineTo(W-8,y);g.stroke();g.fillText(Math.round(max*k/4/1000)+'k',0,y+4);}
  pj.forEach(function(p,i){if(i%Math.ceil(pj.length/6)===0||i===pj.length-1)g.fillText(p.y+'ปี',X(i)-8,H-4);});
  function line(key,col){g.strokeStyle=col;g.lineWidth=2.5;g.beginPath();pj.forEach(function(p,i){if(i)g.lineTo(X(i),Y(p[key]));else g.moveTo(X(i),Y(p[key]));});g.stroke();}
  line('p','#8a9bb0');line('v','#2ecc71');
}

    next={sym:f.symbol,amt:t.net,o:{kind:'buy',price:num(f.price)||'',reason:'ย้ายเงินจากการขาย '+h.symbol+' เพื่อลดน้ำหนักพอร์ต',title:'ขั้นที่ 2: บันทึกการซื้อ '+f.symbol,note:'บันทึกการขายแล้ว ✅ ตอนนี้บันทึกการซื้อด้วยเงินที่ได้ — แก้ NAV และยอดเงินให้ตรงกับที่ซื้อจริง (ถ้ายังไม่ได้ซื้อ กดยกเลิกได้)'}};
  }else if(t.to.indexOf('w:')===0&&t.bu>0){
    var ws=S.watch[+t.to.slice(2)];
    next={sym:ws.s,amt:null,o:{kind:'buy',price:t.wp,units:t.bu,fee:feeOf(t.bu*t.wp),ntype:'stock',reason:'ย้ายเงินจากการขาย '+h.symbol+' ไปซื้อ '+ws.s+' หลังศึกษาแล้ว',title:'ขั้นที่ 2: บันทึกการซื้อ '+ws.s,note:'บันทึกการขายแล้ว ✅ ตอนนี้บันทึกการซื้อ '+esc(ws.s)+' — แก้ราคา จำนวน และค่าคอมให้ตรงกับที่ซื้อจริง (ถ้ายังไม่ได้ซื้อ กดยกเลิกได้)'}};
  }
  txForm(h.symbol,null,{kind:'sell',price:t.p,units:t.su,fee:t.fee,next:next,
   title:(next?'ขั้นที่ 1: ':'')+'บันทึกการขาย '+h.symbol,
   note:'กรอกไว้ให้จากที่ลองคิด — <b>แก้ราคาขายและค่าคอมให้ตรงกับที่ขายจริง</b> (ดูจาก Deal Sum ในแอปโบรก)',
   reason:'ลดน้ำหนัก '+h.symbol+' ให้เหลือประมาณ '+fmt(t.nw,0)+'% ของพอร์ต'+(t.to==='res'?' เก็บเป็นก้อนลงทุนสำรอง':'')});
}
function txHint(){var d=$('x_kind').value==='dividend';$('x_tr').style.display=d?'none':'';$('x_fe').style.display=d?'none':'';txFeeHint();}
/* แสดงค่าธรรมเนียมโดยประมาณเป็นตัวอย่างในช่อง (ไม่กรอกให้เอง ให้ใส่ตัวเลขจริงจากโบรก/K PLUS) */
function txFeeHint(){
  var e=$('x_fee');if(!e)return;
  var sym=$('x_sym').value.trim().toUpperCase(),h=findSym(sym)||{symbol:sym,type:($('x_ntype')&&$('x_new').style.display!=='none'?$('x_ntype').value:'stock')};
  var kind=$('x_kind').value,p=num($('x_price').value),u=num($('x_units').value),a=num($('x_amt').value)||u*p,f=0;
  if(kind==='sell')f=feeFor(h,a);
  else if(kind==='buy'&&h.type!=='fund')f=feeOf(a);
  e.placeholder=a?(f?'ประมาณ '+fmt(f)+' ฿ — ใส่ตัวเลขจริง':'ไม่มีค่าธรรมเนียม (0)'):'';
}
function txNew(){
  var s=$('x_sym').value.trim().toUpperCase(),isNew=!!s&&!findSym(s);
  $('x_new').style.display=isNew?'':'none';
  if(isNew&&!$('x_nsec').value){for(var i=0;i<S.watch.length;i++)if(S.watch[i].s===s&&S.watch[i].k){$('x_nsec').value=S.watch[i].k;break;}}
  txFeeHint();
}
function saveTx(){
  var sym=$('x_sym').value.trim().toUpperCase(),kind=$('x_kind').value,h=findSym(sym),reason=$('x_reason').value.trim();
  if(!sym){toast('ใส่ชื่อหุ้น/กองทุน');return;}
  if(!h&&kind!=='buy'){toast(sym+' ยังไม่มีในพอร์ต — บันทึกได้เฉพาะการซื้อ');return;}
  if(!reason){toast('เขียนเหตุผลสั้น ๆ ก่อนนะ');return;}
  var price=num($('x_price').value),units=num($('x_units').value),amount=num($('x_amt').value),fee=num($('x_fee').value);
  if(kind==='dividend'){price=0;units=0;fee=0;if(!amount){toast('ใส่จำนวนเงินปันผล');return;}}
  else{
    if(!price){toast('ใส่ราคา/NAV');return;}
    if(!units&&amount)units=amount/price;
    if(!amount)amount=units*price;
    if(!units){toast('ใส่จำนวนหน่วยหรือจำนวนเงิน');return;}
  }
  var row={date:$('x_date').value||today(),symbol:sym,kind:kind,units:units,price:price,amount:amount,fee:fee,realized:0,reason:reason};
  if(!h){
    /* หุ้น/กองทุนตัวใหม่: สร้างรายการในพอร์ตพร้อมจำนวนและต้นทุนจากการซื้อครั้งนี้ */
    var nh={symbol:sym,name:'',type:$('x_ntype').value,sector:$('x_nsec').value.trim(),units:units,avg_cost:(amount+fee)/units,price:price,price_updated:new Date().toISOString(),target_pct:0};
    for(var i=0;i<S.watch.length;i++)if(S.watch[i].s===sym){nh.name=S.watch[i].n||'';break;}
    db.insert('inv_transactions',row).then(function(){return db.insert('inv_holdings',nh);})
     .then(function(){closeM();toast('บันทึกแล้ว และเพิ่ม '+sym+' เข้าพอร์ต');return load();}).catch(fail);
    return;
  }
  var upd=null,hu=num(h.units),ha=num(h.avg_cost);
  if(kind==='buy'){var nu=hu+units;upd={units:nu,avg_cost:nu?(hu*ha+amount+fee)/nu:0};if(!num(h.price)){upd.price=price;}}
  if(kind==='sell'){
    if(units>hu+1e-9){toast('ขายเกินจำนวนที่ถืออยู่');return;}
    row.realized=(price-ha)*units-fee;upd={units:hu-units};
  }
  var nx=kind==='sell'?TX_NEXT:null;TX_NEXT=null;
  db.insert('inv_transactions',row).then(function(){return upd?db.update('inv_holdings',h.id,upd):null;})
   .then(function(){closeM();toast('บันทึกแล้ว');return load();})
   .then(function(){if(nx)txForm(nx.sym,nx.amt,nx.o);}).catch(fail);
}
function delTx(id){
  if(!confirm('ลบรายการนี้? (จะไม่ย้อนแก้จำนวน/ต้นทุนในหน้าพอร์ต ต้องแก้เองถ้าจำเป็น)'))return;
  db.remove('inv_transactions',id).then(load).catch(fail);
}

var LESSONS=[
 {id:'l1',t:'มีเงินสำรองก่อนลงทุน',b:'<p>เงินที่เอาไปลงหุ้นควรเป็นเงินที่<b>ไม่ต้องใช้ใน 3–5 ปี</b> และควรมีเงินสำรองฉุกเฉินราว 3–6 เดือนของค่าใช้จ่าย เก็บในบัญชีออมทรัพย์หรือกองตลาดเงินแยกไว้</p><p>คนที่ไม่มีเงินสำรอง มักถูกบังคับให้ขายหุ้นตอนตลาดลงหนัก ซึ่งเป็นจังหวะที่แย่ที่สุด</p>',
  q:'ทำไมต้องมีเงินสำรองก่อนลงทุน',c:['เพื่อให้ได้ดอกเบี้ยสูง','เพื่อไม่ต้องขายหุ้นตอนตลาดลง','เพราะกฎหมายบังคับ'],a:1,w:'เงินสำรองทำให้เราไม่ต้องขายของดีในราคาถูกตอนมีเรื่องด่วน'},
 {id:'l2',t:'DCA ทำงานยังไง',b:'<p>DCA คือลงเงินเท่ากันทุกเดือน เช่น 500 บาท ไม่ว่าราคาจะเป็นเท่าไร</p><p>เดือนที่ราคาตก เงิน 500 ซื้อได้หลายหน่วย เดือนที่ราคาแพงซื้อได้น้อย ต้นทุนเฉลี่ยจึงเกลี่ยตัวเอง ไม่ต้องเดาจังหวะตลาด</p><p>แต่ DCA <b>ไม่ได้การันตีกำไร</b> ต้องใช้กับสิ่งที่ระยะยาวมีแนวโน้มเติบโต เช่น กองดัชนีที่กระจายหลายบริษัท ถ้า DCA หุ้นที่ธุรกิจแย่ลงเรื่อย ๆ ก็ขาดทุนเรื่อย ๆ</p>',
  q:'เดือนที่ NAV กองทุนลดลง เงิน DCA 500 บาทจะ...',c:['ซื้อได้หน่วยน้อยลง','ซื้อได้หน่วยมากขึ้น','ซื้อได้เท่าเดิม'],a:1,w:'ราคาต่อหน่วยถูกลง เงินเท่าเดิมจึงได้หน่วยมากขึ้น'},
 {id:'l3',t:'กองดัชนี vs เลือกหุ้นเอง',b:'<p>กองดัชนี (เช่น S&P500, SET50) ซื้อหุ้นตามดัชนีทั้งตะกร้า ค่าธรรมเนียมมักต่ำ และกระจายความเสี่ยงอัตโนมัติ</p><p>รายงานอย่าง SPIVA ที่เก็บข้อมูลหลายสิบปี พบว่ากองทุนที่ผู้จัดการเลือกหุ้นเอง <b>ส่วนใหญ่แพ้ดัชนีในระยะยาว</b> นักลงทุนรายย่อยที่เลือกหุ้นเองยิ่งทำได้ยาก</p><p>สำหรับงบเดือนละ 500 กองดัชนีเป็นแกนหลักที่สมเหตุสมผล ส่วนหุ้นรายตัวค่อยเป็นส่วนเสริมเมื่อมีความรู้และเงินมากขึ้น</p>',
  q:'ข้อดีหลักของกองดัชนีคือ',c:['รับประกันกำไรทุกปี','ค่าธรรมเนียมต่ำและกระจายความเสี่ยง','ชนะตลาดได้เสมอ'],a:1,w:'กองดัชนีไม่ได้ชนะตลาด แต่ "ได้เท่าตลาด" ด้วยต้นทุนต่ำ ซึ่งชนะคนส่วนใหญ่'},
 {id:'l4',t:'กระจายความเสี่ยง',b:'<p>กระจายความเสี่ยงไม่ได้วัดที่<b>จำนวนตัว</b> แต่วัดที่<b>น้ำหนัก</b> ถ้ามีหุ้น 6 ตัว แต่ตัวเดียวคิดเป็นครึ่งพอร์ต ผลลัพธ์ทั้งพอร์ตก็ขึ้นกับตัวนั้นตัวเดียว</p><p>อีกแบบคือหุ้นกลุ่มเดียวกันมักขึ้นลงพร้อมกัน การกระจายที่ได้ผลคือ<b>ต่างกลุ่ม ต่างประเทศ ต่างประเภทสินทรัพย์</b> และไม่ให้ตัวไหนหนักเกินไป</p>',
  q:'พอร์ต 6 ตัว แต่ตัวเดียวคิดเป็น 75% ถือว่ากระจายความเสี่ยงดีไหม',c:['ดี เพราะมีถึง 6 ตัว','ไม่ดี เพราะน้ำหนักกระจุกที่ตัวเดียว','ดี ถ้าตัวนั้นกำลังกำไร'],a:1,w:'ถ้าตัวที่หนัก 75% ร่วงแรง พอร์ตทั้งก้อนร่วงตาม แม้ตอนนี้จะกำไรก็ตาม'},
 {id:'l5',t:'ติดดอย: กับดักต้นทุนจม',b:'<p>ตลาดไม่รู้ว่าเราซื้อมาที่ราคาเท่าไร ราคาต้นทุนเดิมจึงไม่มีผลต่อว่าหุ้นจะขึ้นหรือลงต่อ</p><p>หุ้นที่ลง 50% ต้องขึ้น <b>100%</b> ถึงจะกลับมาเท่าทุน การ "รอให้กลับมาเท่าทุน" อาจใช้เวลานานมากหรือไม่กลับเลย</p><p>การถัวเฉลี่ยขาลงโดยไม่มีเหตุผลใหม่ = เพิ่มเดิมพันกับสิ่งที่กำลังผิด คำถามที่ถูกคือ "ถ้าวันนี้ถือเงินสด จะซื้อตัวนี้ไหม"</p>',
  q:'หุ้นลง 50% ต้องขึ้นกี่ % ถึงจะเท่าทุน',c:['50%','75%','100%'],a:2,w:'100 → 50 ต้องขึ้นอีก 50 บาท ซึ่งเท่ากับ 100% ของ 50'},
 {id:'l6',t:'ปันผลและกับดักปันผลสูง',b:'<p>ปันผลจ่ายจากกำไรของบริษัท และในวัน XD ราคาหุ้นมักลดลงประมาณเท่าปันผลที่จ่าย ปันผลจึงไม่ใช่ "เงินฟรี"</p><p><b>Dividend trap</b>: อัตราปันผล (yield) ที่ดูสูงผิดปกติ มักเกิดเพราะราคาตก ถ้ากำไรกำลังลด ปันผลรอบหน้าก็จะลดตาม ให้ดูว่ากำไรสม่ำเสมอไหม และจ่ายปันผลเกินกำไรหรือเปล่า</p><p>ปันผลหุ้นไทยถูกหักภาษี ณ ที่จ่าย 10%</p>',
  q:'หุ้นที่ yield สูงขึ้นมากเพราะราคาตกหนัก ควร...',c:['ซื้อทันทีเพราะปันผลสูง','ตรวจว่ากำไรยังสม่ำเสมอไหมก่อน','ขายทันที'],a:1,w:'yield สูงจากราคาตกอาจเป็นสัญญาณว่าตลาดคาดว่ากำไรจะลด'},
 {id:'l7',t:'P/E: แพงหรือถูก',b:'<p>P/E = ราคาหุ้น ÷ กำไรต่อหุ้น (EPS) บอกว่าเราจ่ายเงินเท่ากับกำไรของบริษัทกี่ปี</p><p>ใช้เทียบกับ P/E ในอดีตของหุ้นตัวเอง และเทียบกับหุ้นกลุ่มเดียวกัน P/E ต่ำไม่ได้แปลว่าถูกเสมอ อาจต่ำเพราะตลาดคาดว่ากำไรจะลดลง</p>',
  q:'ราคา 30 บาท EPS 2 บาท P/E เท่ากับ',c:['15','60','28'],a:0,w:'30 ÷ 2 = 15'},

 b:'<h4>1. วัฏจักรเศรษฐกิจ</h4><p>เศรษฐกิจเคลื่อนเป็นวงจร: ฟื้นตัว → ขยายตัว → จุดสูงสุด → หดตัว/ถดถอย → จุดต่ำสุด วัดภาพรวมด้วย GDP</p>'+

  '<h4>2. เงินเฟ้อและผลตอบแทนที่แท้จริง</h4><p>เงินเฟ้อวัดด้วยดัชนีราคาผู้บริโภค (CPI) เงินเฟ้อสูงทำให้เงินสดมีอำนาจซื้อลดลง</p><div class="f">ผลตอบแทนที่แท้จริง ≈ ผลตอบแทนที่ได้ − อัตราเงินเฟ้อ</div><p>ฝากเงินได้ 1% แต่เงินเฟ้อ 2% เท่ากับอำนาจซื้อลดลงประมาณ 1% ต่อปี</p>'+
  '<h4>3. ดอกเบี้ยนโยบาย</h4><p>คณะกรรมการนโยบายการเงิน (กนง.) ของธนาคารแห่งประเทศไทย <b>ขึ้นดอกเบี้ยเพื่อชะลอเงินเฟ้อ</b> และ<b>ลดดอกเบี้ยเพื่อกระตุ้นเศรษฐกิจ</b></p>'+
  '<ul><li>ดอกเบี้ยขึ้น → ราคาตราสารหนี้ที่ออกไปแล้วลดลง, มูลค่าหุ้นถูกกดดันเพราะเงินฝาก/พันธบัตรน่าสนใจขึ้น, บริษัทหนี้เยอะจ่ายดอกเบี้ยมากขึ้น</li><li>ดอกเบี้ยลง → ส่วนต่างดอกเบี้ยสุทธิ (NIM) ของธนาคารมักแคบลง แต่ธุรกิจที่กู้เงินมาก เช่น อสังหา โรงไฟฟ้า ได้ประโยชน์</li></ul>'+
  '<h4>4. อัตราแลกเปลี่ยน</h4><ul><li>บาทอ่อน → ผู้ส่งออกและการท่องเที่ยวได้ประโยชน์, ผู้นำเข้าต้นทุนสูงขึ้น</li><li>บาทแข็ง → ตรงกันข้าม และสินทรัพย์ต่างประเทศที่ถืออยู่มีมูลค่าเป็นบาทลดลง</li></ul>'+
  '<h4>5. โครงสร้างตลาดการเงิน</h4><ul><li><b>ตลาดเงิน</b> ระดมทุนระยะสั้นไม่เกิน 1 ปี · <b>ตลาดทุน</b> ระยะยาวเกิน 1 ปี (หุ้น หุ้นกู้)</li><li><b>ตลาดแรก</b> บริษัทเสนอขายหลักทรัพย์ใหม่ เช่น IPO เงินเข้าบริษัท · <b>ตลาดรอง</b> นักลงทุนซื้อขายกันเอง เงินไม่เข้าบริษัท</li></ul>',
 p:'KBANK, TISCO, KTC อ่อนไหวต่อดอกเบี้ย · GULF (โรงไฟฟ้า) กู้เงินลงทุนมาก ดอกเบี้ยลงเป็นผลดี · K-US500X ลงทุนหุ้นสหรัฐ ถ้ากองไม่ได้ป้องกันความเสี่ยงค่าเงินเต็มจำนวน บาทแข็งจะทำให้ผลตอบแทนเป็นบาทลดลง (ดูนโยบายในหนังสือชี้ชวน) · K-SF-A ถือตราสารหนี้ระยะสั้น ได้รับผลจากดอกเบี้ยน้อยกว่าตราสารหนี้ระยะยาว',
 qs:[
  {q:'กนง. ขึ้นอัตราดอกเบี้ยนโยบาย โดยทั่วไปมีเป้าหมายหลักเพื่อ',c:['กระตุ้นการส่งออก','ชะลออัตราเงินเฟ้อ','เพิ่มการลงทุนภาคเอกชน','ทำให้เงินบาทอ่อนค่า'],a:1,w:'ดอกเบี้ยสูงทำให้การกู้ยืมและใช้จ่ายชะลอลง ลดแรงกดดันเงินเฟ้อ'},
  {q:'เมื่ออัตราดอกเบี้ยในตลาดสูงขึ้น ราคาตราสารหนี้ที่ออกไปแล้วจะ',c:['สูงขึ้น','ลดลง','ไม่เปลี่ยนแปลง','สูงขึ้นเฉพาะตราสารระยะยาว'],a:1,w:'ตราสารเดิมจ่ายดอกเบี้ยต่ำกว่าตราสารใหม่ ราคาต้องลดลงจนผลตอบแทนเทียบเท่าตลาด'},
  {q:'ได้ผลตอบแทน 5% ต่อปี อัตราเงินเฟ้อ 3% ผลตอบแทนที่แท้จริงโดยประมาณคือ',c:['8%','5%','3%','2%'],a:3,w:'5% − 3% ≈ 2% (ค่าที่แม่นยำคือ 1.05 ÷ 1.03 − 1 ≈ 1.94%)'},
  {q:'ช่วงเศรษฐกิจถดถอย หุ้นกลุ่มใดมักมีกำไรทนทานที่สุด',c:['วัสดุก่อสร้าง','ยานยนต์','ค้าปลีกสินค้าจำเป็น','ปิโตรเคมี'],a:2,w:'สินค้าจำเป็นยังต้องซื้อแม้เศรษฐกิจแย่ จึงเป็นกลุ่ม Defensive'},
  {q:'เงินบาทอ่อนค่าลงมาก ธุรกิจใดมักได้ประโยชน์',c:['ผู้นำเข้าน้ำมัน','ผู้ส่งออกสินค้า','บริษัทที่มีหนี้เป็นเงินดอลลาร์','ผู้นำเข้าเครื่องจักร'],a:1,w:'ขายของได้เงินดอลลาร์ แลกกลับเป็นบาทได้มากขึ้น'},
  {q:'บริษัทเสนอขายหุ้นต่อประชาชนเป็นครั้งแรก (IPO) เป็นการซื้อขายในตลาดใด',c:['ตลาดแรก','ตลาดรอง','ตลาดเงิน','ตลาดอนุพันธ์'],a:0,w:'ตลาดแรกคือที่บริษัทขายหลักทรัพย์ใหม่ เงินเข้าบริษัทโดยตรง'},
  {q:'ตลาดเงิน (Money Market) คือตลาดระดมทุนระยะเวลา',c:['ไม่เกิน 1 ปี','1–5 ปี','เกิน 5 ปี','ไม่มีกำหนด'],a:0,w:'ตลาดเงินคือระยะสั้นไม่เกิน 1 ปี ส่วนตลาดทุนคือระยะยาว'},
  {q:'ตัวเลขเศรษฐกิจล่าสุดยังแย่ แต่ดัชนีหุ้นปรับขึ้น คำอธิบายที่เหมาะสมที่สุดคือ',c:['ตลาดหุ้นไม่เกี่ยวกับเศรษฐกิจ','ตลาดสะท้อนการคาดการณ์ว่าเศรษฐกิจจะดีขึ้น','ตัวเลขเศรษฐกิจผิด','มีการปั่นหุ้นทั้งตลาด'],a:1,w:'ราคาหุ้นสะท้อนอนาคตที่คาดการณ์ จึงมักเคลื่อนไหวนำเศรษฐกิจจริง'},
  {q:'ถ้า กนง. ลดดอกเบี้ยนโยบายต่อเนื่อง ส่วนต่างดอกเบี้ยสุทธิ (NIM) ของธนาคารมักจะ',c:['กว้างขึ้น','แคบลง','ไม่เปลี่ยน','กลายเป็นติดลบทันที'],a:1,w:'ดอกเบี้ยเงินกู้มักปรับลงเร็วกว่าต้นทุนเงินฝาก ทำให้ส่วนต่างแคบลง'},
  {q:'บริษัทโรงไฟฟ้าที่มีหนี้สินสูง จะได้ประโยชน์มากที่สุดในสถานการณ์ใด',c:['ดอกเบี้ยขาขึ้น','ดอกเบี้ยขาลง','เงินเฟ้อสูง','บาทอ่อนค่าและมีหนี้ดอลลาร์'],a:1,w:'ดอกเบี้ยลด ภาระดอกเบี้ยจ่ายลดลง กำไรสุทธิเพิ่มขึ้น'}
 ]},
{id:'c2',t:'ตลาดหุ้นไทยและกลไกซื้อขาย',s:'SET/mai ช่วงราคา Odd lot T+2 XD คำสั่งซื้อขาย',
 b:'<h4>1. SET และ mai</h4><p><b>SET</b> สำหรับบริษัทขนาดใหญ่ · <b>mai</b> สำหรับบริษัทขนาดกลางและเล็ก เกณฑ์ทุนและกำไรต่ำกว่า หุ้นมักผันผวนกว่า</p>'+
  '<h4>2. ช่วงเวลาซื้อขาย (โดยสรุป)</h4><ul><li><b>Pre-open</b> ส่งคำสั่งได้แต่ยังไม่จับคู่ แล้วคำนวณราคาเปิดครั้งเดียว</li><li><b>ช่วงเช้า</b> 10:00–12:30 และ<b>ช่วงบ่าย</b> 14:30–16:30 จับคู่ต่อเนื่อง</li><li><b>Pre-close</b> ช่วงสั้น ๆ ท้ายวัน แล้วคำนวณราคาปิด</li></ul>'+
  '<h4>3. หน่วยการซื้อขาย</h4><ul><li><b>Board lot</b> = 100 หุ้น ซื้อขายในกระดานหลัก</li><li><b>Odd lot</b> = 1–99 หุ้น ซื้อขายในกระดานเศษหุ้น สภาพคล่องต่ำกว่า</li></ul>'+
  '<h4>4. ช่วงราคา (Tick size)</h4><p>ราคาขยับได้ทีละขั้น ขึ้นกับระดับราคาหุ้น</p><table class="tb"><tr><td>ต่ำกว่า 2 บาท</td><td>0.01</td></tr><tr><td>2 – ต่ำกว่า 5</td><td>0.02</td></tr><tr><td>5 – ต่ำกว่า 10</td><td>0.05</td></tr><tr><td>10 – ต่ำกว่า 25</td><td>0.10</td></tr><tr><td>25 – ต่ำกว่า 100</td><td>0.25</td></tr><tr><td>100 – ต่ำกว่า 200</td><td>0.50</td></tr><tr><td>200 – ต่ำกว่า 400</td><td>1.00</td></tr><tr><td>400 ขึ้นไป</td><td>2.00</td></tr></table>'+
  '<p><b>Ceiling / Floor</b>: ราคาเปลี่ยนได้ไม่เกิน ±30% จากราคาปิดวันก่อน</p>'+
  '<h4>5. ประเภทคำสั่ง</h4><ul><li><b>Limit</b> กำหนดราคาเอง</li><li><b>ATO</b> ซื้อขายที่ราคาเปิด · <b>ATC</b> ที่ราคาปิด</li><li><b>MP</b> ซื้อขายที่ราคาตลาดขณะนั้น</li></ul>'+
  '<h4>6. การชำระราคาและสิทธิประโยชน์</h4><ul><li>ชำระเงิน/รับหุ้น <b>T+2</b> คือ 2 วันทำการหลังวันซื้อขาย</li><li><b>XD</b> (Excluded Dividend) ผู้ที่ซื้อตั้งแต่วัน XD ไม่ได้ปันผลรอบนั้น ต้องซื้อ<b>ก่อนวัน XD</b></li><li>วัน XD ราคามักปรับลงประมาณเท่าปันผลต่อหุ้น</li><li>ปันผลหุ้นไทยถูกหักภาษี ณ ที่จ่าย 10%</li><li>เครื่องหมายอื่น: <b>SP</b> ห้ามซื้อขายชั่วคราว, <b>H</b> หยุดพักชั่วคราว, <b>NP</b> ยังไม่ส่งงบ/ข้อมูลตามกำหนด</li></ul>',
 p:'AP ราคา 8.00 ช่วงราคาคือ 0.05 (ขั้นถัดไป 8.05) · ONEE ราคา 2.98 ช่วงราคาคือ 0.02 · GULF ราคา 61.75 ช่วงราคาคือ 0.25 · DOHOME 3 หุ้น และ KTC 1 หุ้น เป็นเศษหุ้น ต้องขายในกระดาน Odd lot',
 qs:[
  {q:'หุ้นราคา 8.00 บาท ช่วงราคา (Tick size) คือเท่าใด',c:['0.01','0.02','0.05','0.10'],a:2,w:'ราคา 5 ถึงต่ำกว่า 10 บาท ขยับทีละ 0.05'},
  {q:'หุ้นราคา 2.98 บาท ราคาเสนอขายขั้นถัดไปที่สูงกว่าคือ',c:['2.99','3.00','3.03','3.08'],a:1,w:'ราคา 2 ถึงต่ำกว่า 5 บาท ขยับทีละ 0.02 → 2.98 + 0.02 = 3.00'},
  {q:'ต้องการขายหุ้น 50 หุ้น ต้องส่งคำสั่งในกระดานใด',c:['กระดานหลัก (Main board)','กระดานเศษหุ้น (Odd lot)','กระดานรายใหญ่ (Big lot)','ขายนอกตลาดเท่านั้น'],a:1,w:'ต่ำกว่า 100 หุ้น คือเศษหุ้น ซื้อขายในกระดาน Odd lot'},
  {q:'ซื้อหุ้นวันจันทร์ (ไม่มีวันหยุด) ต้องชำระเงินวันใด',c:['วันจันทร์','วันอังคาร','วันพุธ','วันพฤหัสบดี'],a:2,w:'T+2 คือ 2 วันทำการหลังวันซื้อ'},
  {q:'ต้องการได้รับเงินปันผลรอบนี้ ต้องซื้อหุ้นอย่างช้าที่สุดเมื่อใด',c:['วัน XD','1 วันทำการก่อนวัน XD','วันจ่ายปันผล','วันประชุมผู้ถือหุ้น'],a:1,w:'ผู้ที่ซื้อตั้งแต่วัน XD ไม่ได้สิทธิ์ ต้องซื้อก่อนหน้านั้น'},
  {q:'ราคาปิดวันก่อน 10.00 บาท ราคาสูงสุดที่ซื้อขายได้วันนี้ (Ceiling) คือ',c:['11.00','12.00','13.00','15.00'],a:2,w:'Ceiling = +30% จากราคาปิดวันก่อน → 13.00'},
  {q:'คำสั่ง ATO หมายถึง',c:['ซื้อขายที่ราคาเปิด','ซื้อขายที่ราคาปิด','ซื้อขายที่ราคาตลาดขณะนั้น','ยกเลิกคำสั่งอัตโนมัติ'],a:0,w:'ATO = At The Open ใช้ในช่วง Pre-open'},
  {q:'วัน XD ราคาหุ้นมักปรับลดลงประมาณเท่าใด',c:['10%','เท่ากับปันผลต่อหุ้น','ครึ่งหนึ่งของปันผล','ไม่ลดลง'],a:1,w:'มูลค่าส่วนที่จ่ายเป็นปันผลออกจากบริษัทไปแล้ว ราคาจึงปรับลงประมาณเท่าปันผล'},
  {q:'ข้อใดอธิบาย mai ได้ถูกต้อง',c:['ตลาดสำหรับกองทุนรวม','ตลาดสำหรับบริษัทขนาดกลางและเล็ก','ตลาดสำหรับหุ้นต่างประเทศ','ตลาดสำหรับตราสารหนี้'],a:1,w:'mai มีเกณฑ์ขนาดทุนและกำไรต่ำกว่า SET'},
  {q:'หุ้นขึ้นเครื่องหมาย SP หมายความว่า',c:['จ่ายปันผลพิเศษ','ห้ามซื้อขายชั่วคราว','ราคาขึ้นถึง Ceiling','เป็นหุ้นในดัชนี SET50'],a:1,w:'SP (Suspension) ตลาดสั่งห้ามซื้อขายชั่วคราว'}
 ]},
{id:'c3',t:'อ่านงบการเงิน',s:'งบกำไรขาดทุน งบฐานะการเงิน งบกระแสเงินสด',
 b:'<h4>1. งบกำไรขาดทุน — ปีนี้ทำกำไรได้เท่าไร</h4><div class="f">รายได้ − ต้นทุนขาย = กำไรขั้นต้น<br>กำไรขั้นต้น − ค่าใช้จ่ายขายและบริหาร = กำไรจากการดำเนินงาน (EBIT)<br>EBIT − ดอกเบี้ยจ่าย − ภาษี = กำไรสุทธิ</div>'+
  '<div class="f">กำไรต่อหุ้น (EPS) = กำไรสุทธิ ÷ จำนวนหุ้น</div>'+
  '<p>ระวัง<b>กำไรพิเศษครั้งเดียว</b> เช่น ขายที่ดิน กำไรจากอัตราแลกเปลี่ยน ให้ดู<b>กำไรจากการดำเนินงานปกติ (Core profit)</b> เป็นหลัก</p>'+
  '<h4>2. งบฐานะการเงิน (งบดุล) — มีอะไร เป็นหนี้เท่าไร</h4><div class="f">สินทรัพย์ = หนี้สิน + ส่วนของผู้ถือหุ้น</div>'+
  '<ul><li><b>หมุนเวียน</b> = เปลี่ยนเป็นเงินสดหรือต้องจ่ายภายใน 1 ปี</li><li><b>ส่วนของผู้ถือหุ้น</b> = มูลค่าทางบัญชีที่เป็นของผู้ถือหุ้น</li></ul>'+
  '<h4>3. งบกระแสเงินสด — เงินเข้าออกจริง</h4><ul><li><b>กิจกรรมดำเนินงาน (CFO)</b> เงินสดจากธุรกิจหลัก</li><li><b>กิจกรรมลงทุน</b> ซื้อขายเครื่องจักร ที่ดิน บริษัทลูก</li><li><b>กิจกรรมจัดหาเงิน</b> กู้เงิน คืนหนี้ ออกหุ้น จ่ายปันผล</li></ul>'+
  '<div class="f">กระแสเงินสดอิสระ (FCF) = CFO − รายจ่ายลงทุน (CAPEX)</div>'+
  '<p><b>สัญญาณเตือน:</b> กำไรสุทธิโตทุกปี แต่ CFO ติดลบต่อเนื่อง อาจแปลว่าขายเชื่อแล้วเก็บเงินไม่ได้ หรือสต็อกค้าง</p>'+

  {q:'รายได้ 1,000 ล้านบาท ต้นทุนขาย 600 ล้านบาท อัตรากำไรขั้นต้นคือ',c:['60%','40%','6%','166%'],a:1,w:'(1,000 − 600) ÷ 1,000 = 40%'},

{id:'c4',t:'อัตราส่วนทางการเงิน',s:'P/E P/BV ROE D/E ปันผล สภาพคล่อง',
 b:'<h4>1. อัตราส่วนประเมินราคา</h4><div class="f">P/E = ราคา ÷ EPS</div><p>จ่ายเงินเท่ากับกำไรกี่ปี P/E ต่ำอาจถูกจริง หรือตลาดคาดว่ากำไรจะลด ต้องเทียบกับอดีตของตัวเองและคู่แข่ง</p>'+
  '<div class="f">มูลค่าตามบัญชีต่อหุ้น (BVPS) = ส่วนของผู้ถือหุ้น ÷ จำนวนหุ้น<br>P/BV = ราคา ÷ BVPS</div><p>นิยมใช้กับ<b>ธนาคาร</b>และธุรกิจที่สินทรัพย์ส่วนใหญ่เป็นตัวเงิน</p>'+
  '<h4>2. ความสามารถทำกำไร</h4><div class="f">ROE = กำไรสุทธิ ÷ ส่วนของผู้ถือหุ้น<br>ROA = กำไรสุทธิ ÷ สินทรัพย์รวม<br>อัตรากำไรสุทธิ = กำไรสุทธิ ÷ รายได้</div><p>ROE สูงดี แต่ต้องดูว่า<b>มาจากการกู้หนี้มาก</b>หรือเปล่า ถ้าใช่ ความเสี่ยงสูงขึ้นด้วย</p>'+
  '<h4>3. หนี้สินและสภาพคล่อง</h4><div class="f">D/E = หนี้สินรวม ÷ ส่วนของผู้ถือหุ้น<br>Current ratio = สินทรัพย์หมุนเวียน ÷ หนี้สินหมุนเวียน</div><p>D/E ที่ "สูง" ขึ้นกับอุตสาหกรรม เช่น โรงไฟฟ้าและธนาคารมีหนี้สูงเป็นปกติ Current ratio ต่ำกว่า 1 แปลว่าหนี้ระยะสั้นมากกว่าสินทรัพย์ระยะสั้น</p>'+
  '<h4>4. ปันผล</h4><div class="f">อัตราปันผล (Dividend yield) = ปันผลต่อหุ้น ÷ ราคา<br>อัตราการจ่ายปันผล (Payout ratio) = ปันผลต่อหุ้น ÷ EPS</div><p>Payout เกิน 100% คือจ่ายมากกว่ากำไร ทำต่อเนื่องไม่ได้นาน</p>'+
  '<h4>5. หลักการใช้</h4><ul><li>เทียบกับ<b>บริษัทในกลุ่มเดียวกัน</b>และ<b>อดีตของตัวเอง</b> ไม่เทียบข้ามอุตสาหกรรม</li><li>ดูหลายอัตราส่วนประกอบกัน ไม่ตัดสินจากตัวเดียว</li><li>ดูแนวโน้มหลายปี ไม่ใช่ปีเดียว</li></ul>',
 p:'ใช้อัตราส่วนบทนี้กับเช็กลิสต์ในแท็บ "น่าศึกษา" ได้เลย เปิด Factsheet ที่ set.or.th แล้วกรอก P/E และอัตราปันผล จากนั้นเทียบกับหุ้นกลุ่มเดียวกัน เช่น KBANK เทียบกับ TISCO ด้วย P/BV และ ROE',
 qs:[
  {q:'หุ้นราคา 40 บาท EPS 2.50 บาท P/E เท่ากับ',c:['10 เท่า','16 เท่า','25 เท่า','100 เท่า'],a:1,w:'40 ÷ 2.50 = 16 เท่า'},
  {q:'ส่วนของผู้ถือหุ้น 1,000 ล้านบาท หุ้น 100 ล้านหุ้น ราคาตลาด 15 บาท P/BV เท่ากับ',c:['0.67 เท่า','1.5 เท่า','10 เท่า','15 เท่า'],a:1,w:'BVPS = 1,000 ÷ 100 = 10 บาท → P/BV = 15 ÷ 10 = 1.5 เท่า'},
  {q:'กำไรสุทธิ 120 ล้านบาท ส่วนของผู้ถือหุ้น 800 ล้านบาท ROE เท่ากับ',c:['6.7%','12%','15%','20%'],a:2,w:'120 ÷ 800 = 15%'},
  {q:'ปันผลต่อหุ้น 0.60 บาท ราคาหุ้น 12 บาท อัตราปันผลเท่ากับ',c:['0.5%','5%','7.2%','20%'],a:1,w:'0.60 ÷ 12 = 5%'},
  {q:'EPS 2.00 บาท จ่ายปันผล 1.60 บาทต่อหุ้น Payout ratio เท่ากับ',c:['20%','80%','125%','160%'],a:1,w:'1.60 ÷ 2.00 = 80%'},
  {q:'หนี้สินรวม 600 ล้านบาท ส่วนของผู้ถือหุ้น 400 ล้านบาท D/E เท่ากับ',c:['0.67 เท่า','1.0 เท่า','1.5 เท่า','2.5 เท่า'],a:2,w:'600 ÷ 400 = 1.5 เท่า'},
  {q:'สินทรัพย์หมุนเวียน 500 ล้านบาท หนี้สินหมุนเวียน 250 ล้านบาท Current ratio เท่ากับ',c:['0.5 เท่า','1.0 เท่า','2.0 เท่า','2.5 เท่า'],a:2,w:'500 ÷ 250 = 2.0 เท่า'},
  {q:'หุ้นมี P/E ต่ำกว่าค่าเฉลี่ยอุตสาหกรรมมาก ข้อสรุปที่เหมาะสมที่สุดคือ',c:['ถูกแน่นอน ควรซื้อทันที','อาจถูกจริง หรือตลาดคาดว่ากำไรจะลดลง ต้องศึกษาเพิ่ม','แพงเกินไป','P/E ไม่มีประโยชน์'],a:1,w:'P/E ต่ำอาจสะท้อนว่าตลาดคาดกำไรอนาคตลดลง (Value trap) ต้องดูเหตุผลประกอบ'},
  {q:'หุ้นกลุ่มธนาคารนิยมใช้อัตราส่วนใดเปรียบเทียบมูลค่า',c:['P/BV','Current ratio','อัตรากำไรขั้นต้น','Inventory turnover'],a:0,w:'สินทรัพย์ธนาคารส่วนใหญ่เป็นตัวเงิน มูลค่าทางบัญชีจึงสะท้อนมูลค่าได้ดี'},
  {q:'บริษัท A และ B มี ROE 20% เท่ากัน แต่ A มี D/E 3 เท่า ส่วน B มี D/E 0.5 เท่า ข้อใดถูกต้อง',c:['A ดีกว่าเพราะใช้หนี้เก่ง','B มีคุณภาพผลตอบแทนดีกว่าเพราะไม่ได้พึ่งหนี้มาก','ทั้งคู่เหมือนกันทุกประการ','D/E ไม่เกี่ยวกับ ROE'],a:1,w:'ROE ของ A ถูกขยายด้วยหนี้ ถ้าธุรกิจสะดุด ความเสี่ยงสูงกว่า B มาก'}
 ]}
];
function shuf(n){var a=[],i,j,t;for(i=0;i<n;i++)a.push(i);for(i=n-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function chUnlocked(i){var p=i>0&&S.lessons[COURSE[i-1].id];return i===0||!!(p&&p.pass);}
PAGES.learn=function(){
  var passed=0,list='',total=COURSE.length+SOON.length;
  COURSE.forEach(function(c,i){
    var r=S.lessons[c.id],u=chUnlocked(i);if(r&&r.pass)passed++;
    list+='<div class="item" onclick="openCh('+i+')"'+(u?'':' style="opacity:.5"')+'><div><b>บทที่ '+(i+1)+'</b> '+c.t+'<div class="muted">'+c.s+'</div></div><div class="r">'+(r&&r.pass?'✅ '+r.best+'%':(u?(r?r.best+'%':'🔓'):'🔒'))+'</div></div>';
  });
  SOON.forEach(function(t,k){list+='<div class="item" style="cursor:default;opacity:.4"><div><b>บทที่ '+(COURSE.length+k+1)+'</b> '+t+'<div class="muted">เร็ว ๆ นี้</div></div><div>⏳</div></div>';});
  var mh='';(S.lessons.mock||[]).forEach(function(x){mh+=kv(esc(x.d),x.s+'% ('+x.n+' ข้อ)',x.s>=PASS?'up':'down');});
  var done=0,fl='';
  LESSONS.forEach(function(l,i){var d=!!S.lessons[l.id];if(d)done++;fl+='<div class="item" onclick="openL('+i+')"><div>'+(i+1)+'. '+l.t+'</div><div>'+(d?'✅':'›')+'</div></div>';});
  return '<div class="card"><h2>📚 เส้นทางเรียน (อิงหลักสูตร IC P1)</h2><p class="muted">ผ่านทีละบทด้วยคะแนน '+PASS+'% ขึ้นไปเพื่อปลดล็อกบทถัดไป · ข้อสอบเขียนขึ้นใหม่ตามหัวข้อหลักสูตร ไม่ใช่ข้อสอบจริง</p>'+
   '<span class="muted">ผ่านแล้ว '+passed+'/'+total+' บท</span><div class="prog"><div style="width:'+(passed/total*100)+'%"></div></div></div>'+
   '<div class="card">'+list+'</div>'+
   '<div class="card"><h2>📝 สอบจำลอง</h2><p class="muted">สุ่ม '+MOCK_N+' ข้อจากทุกบทที่มี · จับเวลา '+MOCK_MIN+' นาที · ไม่เฉลยระหว่างทำ · สรุปคะแนนแยกบท</p><button class="btn" onclick="startMock()">เริ่มสอบจำลอง</button>'+(mh?'<label>ผลล่าสุด</label><div class="q">'+mh+'</div>':'')+'</div>'+
   '<div class="card"><h2>บทปูพื้น</h2><span class="muted">ผ่านแล้ว '+done+'/'+LESSONS.length+'</span><div class="prog"><div style="width:'+(done/LESSONS.length*100)+'%"></div></div>'+fl+'</div>';
};
var Q=null,QT=null;
function openCh(i){
  if(!chUnlocked(i)){toast('ต้องผ่านบทที่ '+i+' ก่อน ('+PASS+'% ขึ้นไป)');return;}
  var c=COURSE[i],r=S.lessons[c.id];
  modal('<div class="lesson"><div class="muted">บทที่ '+(i+1)+' · อิงหลักสูตร IC P1</div><h3>'+c.t+'</h3>'+c.b+
   '<div class="res blue"><b>ใช้กับพอร์ตคุณ</b><p style="margin:6px 0 0">'+c.p+'</p></div>'+
   (r?'<p class="muted">คะแนนดีที่สุด '+r.best+'%'+(r.pass?' · ✅ ผ่านแล้ว':'')+'</p>':'')+
   '<div class="row" style="margin-top:12px"><button class="btn" onclick="startQuiz('+i+')">ทำแบบทดสอบ ('+c.qs.length+' ข้อ)</button><button class="btn ghost" onclick="closeM()">ปิด</button></div></div>');
}
function qOrd(list){return list.map(function(it){return shuf(COURSE[it.c].qs[it.q].c.length);});}
function startQuiz(i){
  var list=COURSE[i].qs.map(function(q,k){return {c:i,q:k};});
  Q={mode:'ch',ch:i,list:list,ord:qOrd(list),ans:[],i:0};
  qRender();
}
function startMock(){
  var all=[],list=[],o,k;
  COURSE.forEach(function(c,ci){c.qs.forEach(function(q,qi){all.push({c:ci,q:qi});});});
  o=shuf(all.length);for(k=0;k<Math.min(MOCK_N,all.length);k++)list.push(all[o[k]]);
  Q={mode:'mock',list:list,ord:qOrd(list),ans:[],i:0,end:Date.now()+MOCK_MIN*60000};
  if(QT)clearInterval(QT);QT=setInterval(qTick,1000);
  qRender();
}
function qTick(){
  if(!Q||Q.mode!=='mock'||!$('qt')){clearInterval(QT);QT=null;return;}
  var s=Math.max(0,Math.round((Q.end-Date.now())/1000));
  $('qt').textContent='⏱ '+Math.floor(s/60)+':'+pad(s%60);
  if(s<=0)qFinish();
}
function qRender(){
  var it=Q.list[Q.i],q=COURSE[it.c].qs[it.q],a=Q.ans[Q.i],mock=Q.mode==='mock',show=a!=null&&!mock,last=Q.i===Q.list.length-1;
  var h='<div class="row" style="justify-content:space-between"><span class="muted">'+(mock?'สอบจำลอง':'บทที่ '+(Q.ch+1))+' · ข้อ '+(Q.i+1)+'/'+Q.list.length+'</span>'+(mock?'<b id="qt" class="warn"></b>':'')+'</div>'+
   '<div class="prog"><div style="width:'+(Q.i/Q.list.length*100)+'%"></div></div><p style="font-size:17px">'+q.q+'</p>';
  Q.ord[Q.i].forEach(function(oi){
    var st='';
    if(show){if(oi===q.a)st=' style="border:2px solid var(--up)"';else if(oi===a)st=' style="border:2px solid var(--down)"';}
    else if(a===oi)st=' style="border:2px solid var(--accent)"';
    h+='<button class="btn ghost choice"'+st+(show?' disabled':'')+' onclick="qAns('+oi+')">'+q.c[oi]+'</button>';
  });
  if(show)h+='<div class="res '+(a===q.a?'green':'red')+'"><b>'+(a===q.a?'ถูกต้อง ✅':'ยังไม่ใช่')+'</b><p style="margin:6px 0 0">'+q.w+'</p></div>';
  h+='<div class="row" style="margin-top:12px">'+(a!=null?'<button class="btn" onclick="qNext()">'+(last?'ดูผล':'ข้อถัดไป')+'</button>':'')+'<button class="btn ghost" onclick="qQuit()">ออก</button></div>';
  modal(h);
  if(mock)qTick();
}
function qAns(oi){if(!Q)return;Q.ans[Q.i]=oi;qRender();}
function qNext(){if(Q.i<Q.list.length-1){Q.i++;qRender();}else qFinish();}
function qQuit(){if(Q&&Q.mode==='mock'&&!confirm('ออกจากการสอบ? คะแนนจะไม่ถูกบันทึก'))return;Q=null;closeM();}
function qFinish(){
  if(!Q||Q.done)return;Q.done=true;
  var ok=0,by={},wrong='',h;
  Q.list.forEach(function(it,k){
    var q=COURSE[it.c].qs[it.q],id=COURSE[it.c].id,r=Q.ans[k]===q.a;
    if(!by[id])by[id]=[0,0];by[id][1]++;
    if(r){ok++;by[id][0]++;}
    else wrong+='<div class="q"><b>'+q.q+'</b><p style="margin:6px 0 0" class="up">✔ '+q.c[q.a]+'</p><p class="muted" style="margin:4px 0 0">'+q.w+'</p></div>';
  });
  var n=Q.list.length,pct=Math.round(ok/n*100),pass=pct>=PASS;
  if(Q.mode==='ch'){
    var c=COURSE[Q.ch],r=S.lessons[c.id]||{best:0,pass:false};
    r.best=Math.max(r.best||0,pct);r.pass=r.pass||pass;r.date=today();S.lessons[c.id]=r;
    h='<h3>ผลบทที่ '+(Q.ch+1)+'</h3><div class="big '+(pass?'up':'down')+'">'+ok+'/'+n+' ('+pct+'%)</div><p>'+
     (pass?(Q.ch+1<COURSE.length?'ผ่านแล้ว 🎉 ปลดล็อกบทที่ '+(Q.ch+2):'ผ่านแล้ว 🎉 ครบทุกบทที่มีตอนนี้ ลองสอบจำลองดู'):'ยังไม่ผ่าน ต้องได้ '+PASS+'% ขึ้นไป อ่านเนื้อหาอีกรอบแล้วทำใหม่ได้')+'</p>';
  }else{
    var rows='';
    COURSE.forEach(function(c,ci){var b=by[c.id];if(!b)return;var p=Math.round(b[0]/b[1]*100);rows+=kv('บทที่ '+(ci+1)+' '+c.t,b[0]+'/'+b[1]+' ('+p+'%)',p>=PASS?'up':'down');});
    var m=S.lessons.mock||[];m.unshift({d:today(),s:pct,n:n});S.lessons.mock=m.slice(0,5);
    h='<h3>ผลสอบจำลอง</h3><div class="big '+(pass?'up':'down')+'">'+ok+'/'+n+' ('+pct+'%)</div><p class="muted">บทที่ได้ต่ำกว่า '+PASS+'% ควรกลับไปทบทวน</p><div class="q">'+rows+'</div>';
  }
  db.setting('lessons',S.lessons).catch(fail);
  h+=(wrong?'<label>ข้อที่ตอบผิด</label>'+wrong:'<p class="up">ถูกทุกข้อ!</p>')+'<div class="row" style="margin-top:12px"><button class="btn" onclick="closeM();render()">กลับหน้าเรียนรู้</button></div>';
  Q=null;modal(h);
}
function openL(i){
  var l=LESSONS[i];
  modal('<div class="lesson"><h3>'+l.t+'</h3>'+l.b+'<div class="q"><b>ทดสอบ:</b> '+l.q+'<div id="qz">'+l.c.map(function(c,j){return '<button class="btn ghost choice" onclick="ansL('+i+','+j+')">'+c+'</button>';}).join('')+'</div></div><button class="btn ghost" onclick="closeM()">ปิด</button></div>');
}
function ansL(i,j){
  var l=LESSONS[i],ok=j===l.a;
  $('qz').innerHTML='<div class="res '+(ok?'green':'red')+'"><b>'+(ok?'ถูกต้อง ✅':'ยังไม่ใช่')+'</b><p style="margin:6px 0 0">'+l.w+'</p></div>'+(ok?'':'<button class="btn sm ghost" onclick="openL('+i+')">ลองใหม่</button>');
  if(ok&&!S.lessons[l.id]){S.lessons[l.id]=true;db.setting('lessons',S.lessons).then(function(){if(S.page==='learn')$('app').innerHTML=PAGES.learn();}).catch(fail);}
}

load();
</script>
